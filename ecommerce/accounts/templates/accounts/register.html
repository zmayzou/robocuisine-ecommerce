{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="auth-card">

                    <div class="text-center mb-5">

                        <h1 class="auth-title">
                            Créer un compte
                        </h1>

                        <p class="auth-subtitle">
                            Rejoignez CookBot dès maintenant
                        </p>

                    </div>

                    <form method="post">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control auth-input"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control auth-input"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password1"
                                class="form-control auth-input"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm password
                            </label>

                            <input
                                type="password"
                                name="password2"
                                class="form-control auth-input"
                                required
                            >

                        </div>

                        <button class="btn-auth-main w-100 border-0">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Déjà un compte ?

                            <a href="/accounts/login/" class="auth-link">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
